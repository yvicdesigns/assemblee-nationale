    .page-dyn-content { font-size:1rem; line-height:1.85; color:#334155; }

    .page-dyn-content .ejr-figure img { max-width:100%; border-radius:8px; display:block; }
    .page-dyn-content .ejr-figure figcaption { text-align:center; font-size:.82rem; color:#64748b; margin-top:8px; font-style:italic; }
    .page-dyn-content .ejr-quote { border-left:4px solid var(--vert); padding:14px 20px; background:#f0fdf4; border-radius:0 8px 8px 0; margin:24px 0; }
    .page-dyn-content .ejr-quote p { margin:0; font-style:italic; color:#166534; }
    .page-dyn-content .ejr-quote cite { display:block; margin-top:8px; font-size:.82rem; color:#64748b; font-style:normal; }
    .page-dyn-content .ejr-delimiter { border:none; border-top:2px solid #e2e8f0; margin:32px 0; }
    .page-dyn-content .ejr-table-wrap { overflow-x:auto; margin:20px 0; }
    .page-dyn-content .ejr-table { width:100%; border-collapse:collapse; font-size:.9rem; }
    .page-dyn-content .ejr-table td, .page-dyn-content .ejr-table th { border:1px solid #e2e8f0; padding:8px 12px; }
    .page-dyn-content .ejr-table th { background:#f8fafc; font-weight:700; }
    .page-dyn-content .ejr-code { background:#1e293b; color:#e2e8f0; padding:20px; border-radius:8px; overflow-x:auto; margin:20px 0; font-size:.85rem; }
    .page-dyn-content .ejr-warning { background:#fffbeb; border:1px solid #fde68a; border-radius:8px; padding:16px 20px; margin:20px 0; }

    .page-dyn-content .ejr-warning p { margin:0; color:#78350f; }
    .page-dyn-content .ejr-embed { position:relative; padding-bottom:56.25%; height:0; margin:24px 0; overflow:hidden; border-radius:8px; }
    .page-dyn-content .ejr-embed iframe { position:absolute; top:0; left:0; width:100%; height:100%; }
    .page-dyn-content .ejr-checklist { list-style:none; padding:0; margin:16px 0; }
    .page-dyn-content .ejr-checklist li { display:flex; gap:10px; padding:4px 0; }
    .page-dyn-content .ejr-check-icon { color:var(--vert); font-weight:700; }

<script>
const SB_URL = 'https://djqrmcuagrfvahmcwbro.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqcXJtY3VhZ3JmdmFobWN3YnJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MjExMDEsImV4cCI6MjA5MzI5NzEwMX0.S8xpx9xLGIilit5OME-GsxM59X7ezIyplFKFDZBWmjE';

document.addEventListener('DOMContentLoaded', async () => {
  const main = document.getElementById('pageMain');
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');

  if (!slug) { show404(main); return; }

  const sb = supabase.createClient(SB_URL, SB_KEY);
  const { data, error } = await sb
    .from('pages')
    .select('*')
    .eq('slug', slug)
    .eq('active', true)
    .single();

  if (error || !data) { show404(main); return; }

  document.title = data.title + ' – Assemblée Nationale';
  document.getElementById('pageHeroTitle').textContent = data.title;
  document.getElementById('pageBreadcrumb').textContent = data.title;
  document.getElementById('pageHero').style.display = '';

  if (data.meta_description) {
    const m = document.createElement('meta');
    m.name = 'description'; m.content = data.meta_description;
    document.head.appendChild(m);
  }

  main.innerHTML = `<div class="page-prose page-dyn-content">${renderEditorContent(data.content)}</div>`;
});

function show404(el) {
  el.innerHTML = `
    <div style="text-align:center;padding:60px 20px;">
      <div style="font-size:3rem;margin-bottom:16px;">🔍</div>
      <h2>Page introuvable</h2>
      <p style="color:#64748b;margin:12px 0 24px;">Cette page n'existe pas ou a été supprimée.</p>
      <a href="../index.html" style="color:var(--vert);font-weight:600;">← Retour à l'accueil</a>
    </div>`;
}
</script>
