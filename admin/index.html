<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — CMS Assemblée Nationale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="login-page">
  <div class="login-card">

    <div class="login-logo">
      <div class="login-emblem">🏛️</div>
      <h1>ASSEMBLÉE NATIONALE<br>République du Congo</h1>
      <p>Panneau d'administration</p>
    </div>

    <h2 class="login-title">Connexion</h2>
    <p class="login-sub">Accès réservé aux administrateurs autorisés.</p>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Adresse e-mail</label>
        <input class="form-control" type="email" id="email" placeholder="admin@assemblee-nationale.cg" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Mot de passe</label>
        <input class="form-control" type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        Se connecter
      </button>

      <div class="login-error" id="loginError"></div>
    </form>

    <div class="tricolor-strip"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL  = 'https://djqrmcuagrfvahmcwbro.supabase.co';
const SUPABASE_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqcXJtY3VhZ3JmdmFobWN3YnJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MjExMDEsImV4cCI6MjA5MzI5NzEwMX0.S8xpx9xLGIilit5OME-GsxM59X7ezIyplFKFDZBWmjE';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// Redirect if already logged in
db.auth.getSession().then(({ data: { session } }) => {
  if (session) window.location.href = 'dashboard.html';
});

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('loginError');
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  btn.textContent = 'Connexion en cours...';
  btn.disabled = true;
  errEl.style.display = 'none';

  const { error } = await db.auth.signInWithPassword({ email, password });

  if (error) {
    errEl.textContent = 'Identifiants incorrects. Veuillez réessayer.';
    errEl.style.display = 'block';
    btn.textContent = 'Se connecter';
    btn.disabled = false;
  } else {
    window.location.href = 'dashboard.html';
  }
});
</script>
</body>
</html>
