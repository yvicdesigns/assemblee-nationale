<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accès au site — Assemblée Nationale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Open Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a1628;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(0,154,68,.15) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(220,36,31,.1) 0%, transparent 50%);
      padding: 24px;
    }

    /* Bande tricolore en haut */
    .triband {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 5px;
      display: flex;
    }
    .triband span { flex: 1; }
    .triband span:nth-child(1) { background: #009A44; }
    .triband span:nth-child(2) { background: #FBDE4A; }
    .triband span:nth-child(3) { background: #DC241F; }

    /* Carte centrale */
    .gate-card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 44px 44px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 64px rgba(0,0,0,.4);
      text-align: center;
    }

    /* Emblème SVG */
    .gate-emblem {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
    }
    .gate-emblem svg { width: 100%; height: 100%; }

    /* Titre */
    .gate-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: #0a1628;
      margin-bottom: 4px;
      line-height: 1.3;
    }
    .gate-sub {
      font-size: .8rem;
      color: #64748b;
      margin-bottom: 8px;
    }

    /* Séparateur tricolore */
    .gate-divider {
      display: flex;
      height: 3px;
      border-radius: 2px;
      overflow: hidden;
      width: 48px;
      margin: 16px auto 28px;
    }
    .gate-divider span { flex: 1; }
    .gate-divider span:nth-child(1) { background: #009A44; }
    .gate-divider span:nth-child(2) { background: #FBDE4A; }
    .gate-divider span:nth-child(3) { background: #DC241F; }

    /* Message */
    .gate-message {
      font-size: .85rem;
      color: #475569;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    /* Formulaire */
    .gate-label {
      display: block;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #475569;
      text-align: left;
      margin-bottom: 8px;
    }
    .gate-input-wrap {
      position: relative;
      margin-bottom: 16px;
    }
    .gate-input {
      width: 100%;
      padding: 13px 44px 13px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: .95rem;
      font-family: inherit;
      color: #1e293b;
      background: #f8fafc;
      transition: border-color .2s;
      outline: none;
    }
    .gate-input:focus { border-color: #009A44; background: #fff; }
    .gate-input.error { border-color: #DC241F; }
    .gate-toggle {
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px;
      color: #94a3b8;
    }

    /* Erreur */
    .gate-error {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: .82rem;
      color: #DC241F;
      margin-bottom: 16px;
      text-align: left;
    }

    /* Bouton */
    .gate-btn {
      width: 100%;
      padding: 14px;
      background: #009A44;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: .95rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background .2s, transform .1s;
      letter-spacing: .3px;
    }
    .gate-btn:hover { background: #007a36; }
    .gate-btn:active { transform: scale(.98); }

    /* Footer */
    .gate-footer {
      margin-top: 32px;
      font-size: .75rem;
      color: #94a3b8;
    }

    @media (max-width: 480px) {
      .gate-card { padding: 36px 24px 32px; }
    }
  </style>
</head>
<body>

<div class="triband"><span></span><span></span><span></span></div>

<div class="gate-card">

  <!-- Emblème -->
  <div class="gate-emblem">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="50" cy="50" r="48" fill="#009A44"/>
      <path d="M50 10 L70 28 L65 65 L50 78 L35 65 L30 28 Z" fill="#FBDE4A" opacity="0.9"/>
      <path d="M50 18 L64 32 L60 62 L50 72 L40 62 L36 32 Z" fill="#DC241F" opacity="0.85"/>
      <circle cx="50" cy="45" r="10" fill="#FFFFFF" opacity="0.9"/>
      <path d="M44 45 L48 49 L57 40" stroke="#009A44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M30 80 Q50 90 70 80" stroke="#FBDE4A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </svg>
  </div>

  <h1 class="gate-title">Assemblée Nationale</h1>
  <p class="gate-sub">République du Congo</p>

  <div class="gate-divider"><span></span><span></span><span></span></div>

  <p class="gate-message">Ce site est actuellement en accès restreint.<br>Veuillez saisir le mot de passe pour continuer.</p>

  <form id="gateForm" autocomplete="off">
    <label class="gate-label" for="gatePass">Mot de passe</label>
    <div class="gate-input-wrap">
      <input
        class="gate-input"
        type="password"
        id="gatePass"
        placeholder="••••••••"
        autocomplete="current-password"
        autofocus
      >
      <button type="button" class="gate-toggle" id="gateToggle" title="Afficher/masquer">👁️</button>
    </div>
    <div class="gate-error" id="gateError">Mot de passe incorrect. Veuillez réessayer.</div>
    <button type="submit" class="gate-btn" id="gateBtn">Accéder au site</button>
  </form>

</div>

<div class="gate-footer">
  © 2026 Assemblée Nationale de la République du Congo
</div>

<script>
  const KEY  = 'an_site_access';
  const PASS = 'AN2026';

  const form    = document.getElementById('gateForm');
  const input   = document.getElementById('gatePass');
  const errorEl = document.getElementById('gateError');
  const toggle  = document.getElementById('gateToggle');
  const btn     = document.getElementById('gateBtn');

  // Afficher / masquer le mot de passe
  toggle.addEventListener('click', () => {
    const isPass = input.type === 'password';
    input.type = isPass ? 'text' : 'password';
    toggle.textContent = isPass ? '🙈' : '👁️';
  });

  // Effacer l'erreur quand l'utilisateur retape
  input.addEventListener('input', () => {
    errorEl.style.display = 'none';
    input.classList.remove('error');
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const val = input.value.trim();

    if (val === PASS) {
      sessionStorage.setItem(KEY, PASS);
      const back = sessionStorage.getItem('gate_back') || '/';
      sessionStorage.removeItem('gate_back');
      window.location.replace(back);
    } else {
      errorEl.style.display = 'block';
      input.classList.add('error');
      input.value = '';
      input.focus();

      // Micro-animation d'erreur
      btn.style.background = '#DC241F';
      setTimeout(() => { btn.style.background = ''; }, 600);
    }
  });

  // Si déjà connecté, aller directement au site
  if (sessionStorage.getItem(KEY) === PASS) {
    window.location.replace('/');
  }
</script>
</body>
</html>
